[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attest-runbook"
version = "0.1.0"
description = "Paper-level pipeline that feeds SYNERGY gold data into the attest kernel and assembles the empirical results."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "attest[all] @ git+https://github.com/herbertkokholm/attest.git",
    "synergy-dataset>=1.2",
]

[project.scripts]
build-goldset = "build_goldset:main"
build-sentinelset = "build_sentinelset:main"
score-audit = "score_audit:main"
adjudicate-from-gold = "adjudicate_from_gold:main"
review-summary = "review_summary:main"
resolve-attest-source-commit = "resolve_attest_source_commit:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["build_goldset", "build_sentinelset", "score_audit", "adjudicate_from_gold", "review_summary", "resolve_attest_source_commit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"

[[tool.mypy.overrides]]
# attest does not ship a py.typed marker, so mypy can't see its type hints
# from a downstream consumer; synergy_dataset ships no stubs either.
module = ["attest.*", "synergy_dataset.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
