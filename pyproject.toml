[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attest-runbook"
version = "0.1.0"
description = "Paper-level pipeline that feeds SYNERGY gold data into the attest kernel and assembles the empirical results."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "attest[all] @ git+https://github.com/herbertkokholm/attest.git",
    "synergy-dataset>=2.2",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[tool.setuptools]
py-modules = ["build_goldset"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
